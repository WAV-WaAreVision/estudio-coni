name: Pregunta
description: Quieres entender cómo funciona algo o por qué hace lo que hace.
title: "[Pregunta] "
labels: ["pregunta"]
projects: ["WAV-WaAreVision/1"]
body:
  - type: markdown
    attributes:
      value: |
        No hay preguntas tontas. Si tienes varias sobre temas distintos, abre una por tema: así cada respuesta queda fácil de encontrar.
        **Nunca escribas aquí** datos de pacientes, contraseñas ni llaves.
  - type: dropdown
    id: area
    attributes:
      label: ¿Sobre qué parte de la app?
      options:
        - Inicio
        - Ideas y motor
        - Buscador
        - Guiones (puerta 1)
        - Reels y voz
        - Carruseles
        - Calendario y publicación (puerta 2)
        - Métricas y Metricool
        - Pilares
        - No sé / otra
    validations:
      required: true
  - type: textarea
    id: pregunta
    attributes:
      label: Tu pregunta
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: ¿Por qué lo preguntas?
      description: Opcional. Saber para qué lo necesitas nos ayuda a responder mejor.
