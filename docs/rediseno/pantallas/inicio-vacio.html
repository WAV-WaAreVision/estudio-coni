<!doctype html>
<html lang="es-CL" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio vacío</title>
<style>/* inlined from ../tokens.css */
/*
 * Conidolly design system, final version ("Calma suiza").
 * Base: direction d1, with the grafts listed in brandkit.md section 0.
 * Single source of truth for the final mockups and, later, for app/globals.css
 * (name-by-name migration in mapeo-tokens.md). No literal colour may live outside this file.
 *
 * Theme: light is the default (daytime scene: Coni between patients, iPhone in daylight).
 * Dark follows iOS through prefers-color-scheme; data-theme="light" or data-theme="dark" on <html>
 * forces one. Every text pair passes WCAG 2.x AA and every control outline passes 3:1
 * (ratios are listed next to each value and in brandkit.md section 3).
 */

/* Geist from the npm package `geist` (the Google Fonts subset lacks U+2248 "≈"). Verified with
   fontTools: « » ¿ ¡ ñ · • ≈ ı (dotless i, used by the wordmark) and the tnum feature. */
@font-face {
  font-family: "Geist";
  src: url("../fonts/Geist-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: light;

  /* ---------- Colour: warm stone neutrals (oklch hue 77 to 91, chroma under 0.016) ---------- */
  --fondo: #f7f6f3; /* page */
  --superficie: #fcfbf9; /* the one raised surface per screen, fields. 1.05:1, always with a line or shadow */
  --tinta: #1d1b18; /* text, primary fill, selection, active tab, focus, section rules. 15.90:1 */
  --apagado: #69645d; /* meta, help, pillar word, chevrons. 5.43:1 (4.79:1 on pista, 5.67:1 on superficie) */
  --campo: #8a847b; /* field and control outlines, secondary outline, empty marks. 3.43:1 (3.58:1 on superficie) */
  --linea: #e5e2dc; /* hairlines between rows. Decorative, 1.20:1 */
  --pista: #ebe8e2; /* slider track, meter track, skeletons, tone-mark chip. 1.13:1 */

  /* ---------- Roles built on ink ---------- */
  --principal: var(--tinta); /* filled primary button */
  --sobre-principal: var(--superficie); /* label on the primary. 16.61:1 */
  --sobre-tinta: var(--superficie); /* toast text, check inside a checked box, today's number. 16.61:1 */

  /* ---------- The signature: raspberry, ONLY the approve slider and the date it commits to ---------- */
  --firma: #a8285a; /* oklch(0.495 0.167 2.2), HSL saturation 62 %. 6.24:1 (5.51:1 on pista). Same value as /l */
  --sobre-firma: var(--superficie); /* arrow on the thumb, label on the filled track. 6.52:1 */
  --firma-rastro: rgb(168 40 90 / 0.14); /* trail behind the thumb while dragging. Ink label on it: 11.35:1 */

  /* ---------- States: inks, never fills. Always text plus icon ---------- */
  --error: #b3261e; /* oklch hue 29, far from the signature (2). Error and destructive text. 6.05:1 */
  --exito: #2e6a44; /* 5.96:1 */
  --aviso: #7d5410; /* warnings, blocks (balance, cap), spend from 80 % of the cap. 6.17:1 */

  /* ---------- Media: constant across themes, the video is always dark under its controls ---------- */
  --velo-video: rgb(29 27 24 / 0.64); /* play disc, "Avatar IA" label, bottom scrim. Text on it >= 5.00:1 even over a white frame */
  --sobre-video: #fcfbf9; /* icons and text on the veil */
  --foto-brillo: 1; /* avatar look photos. The video being approved is never dimmed */

  /* ---------- Focus: a gap in the page colour, then an ink ring. Works on any surface ---------- */
  --anillo-foco: 0 0 0 2px var(--fondo), 0 0 0 4px var(--tinta);

  /* ---------- Elevation: at most one raised surface per screen (sign bar, idea card or toast) ---------- */
  --sombra-barra: 0 -1px 0 var(--linea), 0 -8px 24px rgb(29 27 24 / 0.06); /* faces up */
  --sombra-flotante: 0 0 0 1px var(--linea), 0 8px 24px rgb(29 27 24 / 0.08); /* faces down: idea card, toast */

  /* ---------- Type: one family, three weights, five sizes. rem so the user's text size scales it ---------- */
  --letra: "Geist", ui-sans-serif, -apple-system, system-ui, "Segoe UI", sans-serif;

  --t-pantalla: 2rem; /* 32, screen title, the answer of the screen */
  --i-pantalla: calc(36 / 32);
  --tr-pantalla: -0.022em;
  --t-pieza: 1.5rem; /* 24, piece title, idea hook, cost amount */
  --i-pieza: calc(28 / 24);
  --tr-pieza: -0.014em;
  --t-guion: 1.25rem; /* 20, the script, reading and editing (a role, not a hierarchy step) */
  --i-guion: calc(32 / 20);
  --t-cuerpo: 1.125rem; /* 18, accessibility base: body, rows, buttons */
  --i-cuerpo: calc(24 / 18); /* UI lines */
  --i-prosa: calc(28 / 18); /* paragraphs, Instagram text */
  --t-meta: 0.9375rem; /* 15, meta, section labels, help, units, tone marks */
  --i-meta: calc(20 / 15);
  --t-marca: 2.75rem; /* 44, ONLY the name on the public page /l (brand register, outside the app) */
  --i-marca: calc(48 / 44);

  --peso-normal: 400;
  --peso-medio: 500;
  --peso-fuerte: 600;
  --peso-titulo: 600; /* screen and piece titles; one step lighter at night */
  --cifras: tabular-nums; /* money, times, durations, balances, counts, metrics */

  /* ---------- Space: 4 / 8 grid ---------- */
  --e-1: 4px;
  --e-2: 8px;
  --e-3: 12px;
  --e-4: 16px;
  --e-6: 24px;
  --e-8: 32px;
  --e-10: 40px;
  --e-12: 48px;
  --e-16: 64px;
  --margen: 20px; /* side margin: the left axis never moves */
  --sangria: 36px; /* icon indent = 24 icon box + 12 gap: text of status lines, checkboxes, reasons at x = 56 */
  --columna-max: 560px; /* reading column on tablet or computer */
  --entre-secciones: 40px;
  --final-pagina: 96px; /* free space after the last control, so a toast never covers it */

  /* ---------- Shape: two radii only ---------- */
  --r-12: 12px; /* buttons, fields, photos, video, idea card, toast, chips, thumbnails */
  --r-circulo: 999px; /* what is round by nature: slider, thumb, checkbox, switch, play, dots, meters */

  /* ---------- Lines ---------- */
  --trazo: 1px; /* rules, hairlines, field and secondary outlines */
  --trazo-control: 1.5px; /* checkbox, switch, disabled thumb, voice play ring */
  --trazo-seleccion: 2px; /* selected avatar ring, active tab underline, field in error */
  --medidor: 4px; /* filled mark: spend meter, metric bar, reel progress, rhythm cell */

  /* ---------- Sizes of things you touch ---------- */
  --objetivo-min: 44px;
  --alto-boton: 52px;
  --alto-fila: 64px; /* piece rows */
  --alto-fila-nav: 56px; /* navigation, value and switch rows */
  --alto-pista: 56px; /* approve slider track */
  --pulgar: 48px; /* approve slider thumb, voice play */
  --casilla: 24px;
  --interruptor-ancho: 52px;
  --interruptor-alto: 32px;
  --play-video: 64px;
  --miniatura-ancho: 48px; /* video thumbnail in a row */
  --miniatura-alto: 64px;
  --icono: 20px; /* next to 18 px text */
  --icono-chico: 16px; /* next to 15 px text */
  --icono-nav: 24px;
  --icono-cierre: 32px; /* the closing moment ("Ya se publicó") */
  --barra-max: 112px; /* sign bar without the safe area */

  /* ---------- Motion: only in response to touch, only transform and opacity ---------- */
  --dur-corta: 150ms; /* press: scale(0.98), checkbox, switch */
  --dur-media: 200ms; /* state change, inline confirmation, toast in, disclosure */
  --dur-larga: 220ms; /* thumb returning or reaching the end, idea card in */
  --curva-salida: cubic-bezier(0.23, 1, 0.32, 1); /* enter and settle, no bounce */
  --curva-vuelta: cubic-bezier(0.32, 0.72, 0, 1); /* thumb spring-back, no bounce */
  --latido: 1.6s; /* the "working" dot. Components drop the animation under reduced motion */
  --toast-duracion: 8s;

  /* ---------- Layers ---------- */
  --capa-barra: 10; /* sign bar and bottom navigation */
  --capa-toast: 20;
}

/* ---------- Dark: evening review in a dim room. Same roles, recomputed contrasts ----------
   Night rules: titles one weight lighter (light text on dark spreads), the primary one step below
   the ink so it does not glare, look photos at 94 % brightness, the video to approve never dimmed. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #161513;
    --superficie: #1f1d1a;
    --tinta: #ece9e3; /* 15.06:1 */
    --apagado: #a39d94; /* 6.78:1 (5.52:1 on pista) */
    --campo: #7c766d; /* 4.06:1 (3.30:1 on pista) */
    --linea: #2f2c28;
    --pista: #2a2724;
    --principal: #d6d2cb; /* one step below the ink. Label on it: 12.11:1 */
    --sobre-principal: #161513;
    --sobre-tinta: #161513;
    --firma: #d78099; /* oklch(0.70 0.11 2.2): same hue, chroma lowered so it never reads as glowing pink. 6.46:1 (5.26:1 on pista) */
    --sobre-firma: #161513; /* 6.46:1 */
    --firma-rastro: rgb(215 128 153 / 0.22); /* ink label on it: 8.51:1 */
    --error: #e98a7f; /* 7.31:1 */
    --exito: #86c39c; /* 8.95:1 */
    --aviso: #d9ad66; /* 8.79:1. Told apart from error by hue (78 vs 27) and by its icon */
    --foto-brillo: 0.94;
    --peso-titulo: 500;
    --sombra-barra: 0 -1px 0 var(--linea), 0 -8px 24px rgb(8 7 6 / 0.45);
    --sombra-flotante: 0 0 0 1px var(--linea), 0 8px 24px rgb(8 7 6 / 0.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #161513;
  --superficie: #1f1d1a;
  --tinta: #ece9e3;
  --apagado: #a39d94;
  --campo: #7c766d;
  --linea: #2f2c28;
  --pista: #2a2724;
  --principal: #d6d2cb;
  --sobre-principal: #161513;
  --sobre-tinta: #161513;
  --firma: #d78099;
  --sobre-firma: #161513;
  --firma-rastro: rgb(215 128 153 / 0.22);
  --error: #e98a7f;
  --exito: #86c39c;
  --aviso: #d9ad66;
  --foto-brillo: 0.94;
  --peso-titulo: 500;
  --sombra-barra: 0 -1px 0 var(--linea), 0 -8px 24px rgb(8 7 6 / 0.45);
  --sombra-flotante: 0 0 0 1px var(--linea), 0 8px 24px rgb(8 7 6 / 0.45);
}

/* Reduced motion keeps every state change (colour, opacity, the written state) and drops the
   movement. The approve gesture is identical: only its animations become instant. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-corta: 0ms;
    --dur-media: 0ms;
    --dur-larga: 0ms;
  }
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fondo)}
body{font-family:var(--letra);color:var(--tinta);font-size:var(--t-cuerpo);line-height:var(--i-cuerpo);-webkit-font-smoothing:antialiased}
.frame{width:390px;background:var(--fondo);color:var(--tinta);position:relative}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:15px;font-weight:600;font-variant-numeric:var(--cifras)}
.page{padding:16px var(--margen) var(--final-pagina)}
.par{display:flex;justify-content:space-between;font-size:var(--t-meta);line-height:var(--i-meta)}
.par b{font-weight:600}.par span{color:var(--apagado)}
h1{font-size:var(--t-pantalla);line-height:var(--i-pantalla);letter-spacing:var(--tr-pantalla);font-weight:var(--peso-titulo);text-wrap:balance;margin-top:24px}
.sub{color:var(--apagado);margin-top:4px}
.sec{margin-top:var(--entre-secciones)}
.rot{border-top:1px solid var(--tinta);padding-top:12px;display:flex;justify-content:space-between;font-size:var(--t-meta);line-height:var(--i-meta);margin-bottom:8px}
.rot b{font-weight:600}.rot span{color:var(--apagado);font-variant-numeric:var(--cifras)}
.vac b{display:block;font-weight:600;margin-top:8px}
.vac p{font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:4px}
.sec-btn{text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:var(--alto-boton);padding:0 16px;border:1px solid var(--campo);border-radius:var(--r-12);font:600 var(--t-cuerpo)/1 var(--letra);color:var(--tinta);background:none;margin-top:16px}
.idea{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);min-height:var(--alto-fila)}
.idea:last-of-type{border-bottom:0}
.cas{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--campo);background:var(--superficie);margin-top:0}
.idea .t{font-weight:500}
.idea .p{font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:4px}
.prim{width:100%;border:0;font:inherit;font-weight:600;cursor:not-allowed;display:flex;align-items:center;justify-content:space-between;height:var(--alto-boton);padding:0 16px;border-radius:var(--r-12);background:var(--pista);color:var(--apagado);font-weight:600;margin-top:16px}
.ayuda{font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:8px}
.nav-row{color:inherit;text-decoration:none;display:flex;justify-content:space-between;align-items:center;height:var(--alto-fila-nav);border-top:1px solid var(--linea);font-weight:500;margin-top:16px}
.nav-row svg{color:var(--apagado)}
.tabs{display:flex;border-top:1px solid var(--linea);background:var(--fondo);padding-bottom:34px}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);font-weight:500;position:relative}
.tab.on{color:var(--tinta);font-weight:600}
.tab.on::before{content:"";position:absolute;top:-1px;width:24px;height:2px;background:var(--tinta)}
svg{width:20px;height:20px;flex:none}
.tab svg{width:24px;height:24px}
.etq{padding:48px var(--margen) 16px;font-size:var(--t-meta);color:var(--apagado);font-weight:600;background:var(--fondo)}
</style>
</head>
<body>
<svg style="display:none">
 <symbol id="caret" viewBox="0 0 256 256"><path d="M96 48l80 80-80 80" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="plus" viewBox="0 0 256 256"><path d="M40 128h176M128 40v176" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></symbol>
 <symbol id="arrow" viewBox="0 0 256 256"><path d="M40 128h176M144 56l72 72-72 72" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="house" viewBox="0 0 256 256"><path d="M40 216V116a8 8 0 0 1 2.6-5.9l80-72.7a8 8 0 0 1 10.8 0l80 72.7A8 8 0 0 1 216 116v100M104 216v-56h48v56M24 216h208" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="chart" viewBox="0 0 256 256"><path d="M224 208H32M56 208V120h48v88M104 208V72h48v136M152 208V40h48v168" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="gear" viewBox="0 0 256 256"><circle cx="128" cy="128" r="40" fill="none" stroke="currentColor" stroke-width="16"/><path d="M128 24v28M128 204v28M24 128h28M204 128h28M54 54l20 20M182 182l20 20M54 202l20-20M182 74l20-20" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></symbol>
</svg>

<template id="pantalla">
<div class="sb"><span>10:30</span><span>●●● ▮</span></div>
<main class="page">
 <div class="par"><b>Hola, Coni</b><span>Semana del 5 al 11 de octubre</span></div>
 <h1>Esta semana está al día</h1>

 <section class="sec">
  <div class="rot"><b>Necesita tu firma</b><span>0</span></div>
  <div class="vac"><b>Nada espera tu firma esta semana.</b><p>El lunes a las 8:00 te propongo 5 ideas nuevas.</p></div>
  <a class="sec-btn" href="#ideas">Elegir ideas ahora</a>
  <a class="nav-row" href="#">Ver calendario<svg aria-hidden="true"><use href="#caret"/></svg></a>
 </section>

 <section class="sec" id="ideas">
  <div class="rot"><b>Ideas de la semana</b><span>0 de 5</span></div>
  <div class="idea"><span class="cas"></span><div><div class="t">¿Te achicas para que nadie se incomode?</div><div class="p">Autoestima</div></div></div>
  <div class="idea"><span class="cas"></span><div><div class="t">Si van a discutir, siéntense del mismo lado.</div><div class="p">Pareja y conversación</div></div></div>
  <div class="idea"><span class="cas"></span><div><div class="t">Un visto sin respuesta y ya imaginas lo peor. ¿Te pasa?</div><div class="p">Bienestar emocional</div></div></div>
  <div class="idea"><span class="cas"></span><div><div class="t">Puedes decir que no sin dar explicaciones larguísimas.</div><div class="p">Género y límites</div></div></div>
  <div class="idea"><span class="cas"></span><div><div class="t">¿Tu deseo se apagó o tu cuerpo está en modo alerta?</div><div class="p">Deseo y sexualidad</div></div></div>
  <button class="prim" type="button" disabled>Escribir guiones<svg aria-hidden="true"><use href="#arrow"/></svg></button>
  <p class="ayuda">Elige al menos una idea. Puedes elegir hasta 5.</p>
  <a class="nav-row">Ver todas las ideas<svg><use href="#caret"/></svg></a>
 </section>

 <section class="sec">
  <div class="rot"><b>Consultas</b><span>octubre</span></div>
  <div class="vac"><b>Todavía ninguna en octubre</b></div>
  <button class="sec-btn" type="button">Llegó una consulta<svg><use href="#plus"/></svg></button>
 </section>
</main>
<nav class="tabs">
 <div class="tab on"><svg><use href="#house"/></svg>Inicio</div>
 <div class="tab"><svg><use href="#chart"/></svg>Métricas</div>
 <div class="tab"><svg><use href="#gear"/></svg>Ajustes</div>
</nav>
</template>

<div class="frame" id="claro"></div>
<div id="var"><div class="etq">Variante oscura</div><div class="frame" id="oscuro"></div></div>
<script>
const t=document.getElementById('pantalla');
for(const id of ['claro','oscuro'])document.getElementById(id).append(t.content.cloneNode(true));
/* Copy the dark theme declarations from tokens.css onto the dark frame, so no colour lives here */
const v=document.getElementById('var');
for(const sh of document.styleSheets)for(const r of sh.cssRules)
 if(r.selectorText===':root[data-theme="dark"]')for(const k of r.style)v.style.setProperty(k,r.style.getPropertyValue(k));
</script>
</body>
</html>
