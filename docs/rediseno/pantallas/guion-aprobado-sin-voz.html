<!doctype html>
<html lang="es-CL" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guion aprobado sin voz</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fondo);font-family:var(--letra);color:var(--tinta);-webkit-font-smoothing:antialiased}
.oscuro{--fondo:#161513;--superficie:#1f1d1a;--tinta:#ece9e3;--apagado:#a39d94;--campo:#7c766d;--linea:#2f2c28;--pista:#2a2724;--principal:#d6d2cb;--sobre-principal:#161513;--sobre-tinta:#161513;--firma:#d78099;--sobre-firma:#161513;--error:#e98a7f;--exito:#86c39c;--aviso:#d9ad66;--foto-brillo:.94;--peso-titulo:500;--sombra-barra:0 -1px 0 var(--linea),0 -8px 24px rgb(8 7 6 / .45);--anillo-foco:0 0 0 2px var(--fondo),0 0 0 4px var(--tinta);color-scheme:dark}
.marco{width:390px;background:var(--fondo);color:var(--tinta);position:relative}
.rotulo-variante{font:var(--peso-fuerte) var(--t-meta)/var(--i-meta) var(--letra);color:var(--apagado);padding:24px var(--margen) 8px;border-top:1px solid var(--linea);background:var(--fondo)}
.safe-top{height:47px}
.pagina{padding:0 var(--margen) var(--final-pagina)}
.volver{display:inline-flex;align-items:center;gap:4px;min-height:44px;font:var(--peso-medio) var(--t-cuerpo)/var(--i-cuerpo) var(--letra);color:var(--tinta);margin-left:-4px}
.volver i{font-size:20px}
.par{display:flex;justify-content:space-between;gap:16px;font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:8px;font-variant-numeric:var(--cifras)}
h1{font-size:var(--t-pieza);line-height:var(--i-pieza);letter-spacing:var(--tr-pieza);font-weight:var(--peso-titulo);text-wrap:balance;margin-top:8px}
.estado{display:grid;grid-template-columns:24px 1fr;column-gap:12px;margin-top:16px}
.estado i{font-size:20px;justify-self:center;line-height:24px}
.estado .l1{font-size:var(--t-cuerpo);line-height:var(--i-cuerpo)}
.estado .det{grid-column:2;color:var(--apagado);font-size:var(--t-meta);line-height:var(--i-meta);margin-top:2px}
.exito{color:var(--exito)}
section{margin-top:var(--entre-secciones)}
.rot{border-top:1px solid var(--tinta);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-meta);line-height:var(--i-meta);margin-bottom:12px}
.rot b{font-weight:var(--peso-fuerte)}
.rot span{color:var(--apagado);font-variant-numeric:var(--cifras);display:inline-flex;gap:4px;align-items:center}
.rot span .ok{color:var(--exito)}
.guion p{font-size:var(--t-guion);line-height:var(--i-guion)}
.guion p+p{margin-top:16px}
.ficha{display:inline-block;font-size:var(--t-meta);line-height:20px;font-weight:var(--peso-medio);color:var(--apagado);background:var(--pista);border-radius:var(--r-circulo);padding:0 8px;vertical-align:1px}
.ayuda{font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:12px}
.prosa{font-size:var(--t-cuerpo);line-height:var(--i-prosa)}
.prosa+.prosa{margin-top:28px}
.avatar{display:flex;align-items:center;gap:12px}
.avatar img{width:48px;height:64px;object-fit:cover;border-radius:var(--r-12);filter:brightness(var(--foto-brillo))}
.avatar b{font-size:var(--t-cuerpo);font-weight:var(--peso-fuerte)}
.accion{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.costo{text-align:right;font-variant-numeric:var(--cifras)}
.costo b{display:block;font-size:var(--t-pieza);line-height:var(--i-pieza);font-weight:var(--peso-fuerte)}
.costo span{display:block;font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado)}
.btn{height:var(--alto-boton);border-radius:var(--r-12);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;font:var(--peso-fuerte) var(--t-cuerpo)/1 var(--letra)}
.btn i{font-size:20px}
.principal{background:var(--principal);color:var(--sobre-principal)}
.secundaria{border:1px solid var(--campo);color:var(--tinta);justify-self:start;min-width:176px}
.saldo{font-size:var(--t-meta);line-height:var(--i-meta);color:var(--apagado);margin-top:8px}
.texto-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:var(--peso-fuerte) var(--t-cuerpo)/1 var(--letra);margin-top:32px}
.texto-btn i{font-size:20px}
.barra{position:relative;background:var(--superficie);box-shadow:var(--sombra-barra);padding:12px var(--margen) calc(8px + 34px);z-index:var(--capa-barra)}
.barra .saldo{margin-top:8px}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:99px;background:var(--tinta);transform:translateX(-50%);opacity:.9}
</style>
</head>
<body>
<template id="pantalla">
<div class="safe-top"></div>
<main class="pagina">
  <a class="volver"><i class="ph ph-caret-left"></i>Inicio</a>
  <div class="par"><span>Deseo y sexualidad</span><span>Mito o realidad · 52 s</span></div>
  <h1>El deseo no se apaga, se esconde</h1>
  <div class="estado">
    <i class="ph ph-check-circle exito"></i>
    <span class="l1 exito">Guion aprobado · falta grabar</span>
    <span class="det">Primero grabas la voz y la escuchas. Después, el video.</span>
  </div>


  <section class="guion">
    <div class="rot"><b>Guion</b><span>123 palabras · ≈ 52 s · <i class="ph ph-check ok"></i>Bien</span></div>
    <p><span class="ficha">[warm]</span> El deseo en la pareja no se apaga. Se esconde.</p>
    <p>Hay un mito que escucho todo el tiempo: si hay amor, el deseo aparece solo. Y cuando no aparece, muchas personas sienten que algo anda mal.</p>
    <p>Pero en una relación larga, el deseo muchas veces no llega solo. Se esconde detrás del cansancio, la rutina, el celular y la lista de pendientes. No es que se haya ido. Es que no tiene dónde aparecer.</p>
    <p>Te propongo algo para esta semana. Reserva un rato para ustedes dos, sin pantallas y sin hablar de pendientes. No tiene que terminar en nada. Conversen, ríanse, abrácense sin apuro.</p>
    <p>Y si la falta de deseo te hace sufrir, conversarlo con una profesional también ayuda.</p>
    <p><span class="ficha">[pause]</span> Soy Coni del Rosario.</p>
    <p class="ayuda">Lo que va entre corchetes marca el tono de la voz. No se lee ni sale en los subtítulos.</p>
  </section>

  <section>
    <div class="rot"><b>Texto de la publicación</b><span>98 de 2.200</span></div>
    <p class="prosa">El deseo no se apaga: se esconde detrás del cansancio y la rutina.</p>
    <p class="prosa">Video hecho con mi avatar digital.</p>
    <p class="ayuda">Para cambiar el guion o el texto, vuelve a revisar el guion.</p>
  </section>

  <section>
    <div class="rot"><b>Avatar</b></div>
    <div class="avatar"><img src="../img/look-estudio.jpg" alt=""><b>Estudio</b></div>
  </section>

  <section>
    <div class="rot"><b>Video</b><span>Avatar Estudio</span></div>
    <div class="accion">
      <span class="btn secundaria">Grabar video <i class="ph ph-video-camera"></i></span>
      <div class="costo"><b>US$ 1,36</b><span>~52 s · incluye la voz</span></div>
    </div>
    <p class="saldo">Saldo de API de HeyGen: US$ 50,00. Es aparte de tu plan de HeyGen.</p>
  </section>

  <a class="texto-btn"><i class="ph ph-arrow-counter-clockwise"></i>Volver a revisar el guion</a>
</main>
<div class="barra">
  <div class="accion">
    <span class="btn principal">Grabar voz <i class="ph ph-microphone"></i></span>
    <div class="costo"><b>US$ 0,20</b><span>~682 caracteres</span></div>
  </div>
  <p class="saldo">ElevenLabs: te quedan 99.000 de 100.000 caracteres. Se renuevan el 12 de octubre.</p>
  <span class="home"></span>
</div>
</template>

<div class="marco" id="claro"></div>
<div class="marco oscuro"><p class="rotulo-variante">Variante oscura</p><div id="oscuro"></div></div>
<script>
const t=document.getElementById('pantalla');
document.getElementById('claro').append(t.content.cloneNode(true));
document.getElementById('oscuro').append(t.content.cloneNode(true));
</script>
</body>
</html>
