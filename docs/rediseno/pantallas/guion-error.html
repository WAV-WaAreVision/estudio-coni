<!doctype html>
<html lang="es-CL" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guion · error de producción</title>
<link rel="stylesheet" href="../tokens.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--fondo); color: var(--tinta); font-family: var(--letra); font-size: var(--t-cuerpo); line-height: var(--i-cuerpo); -webkit-font-smoothing: antialiased; }
  .lamina { width: 390px; }
  .rotulo-lamina { padding: 24px var(--margen) 12px; font-size: var(--t-meta); line-height: var(--i-meta); color: var(--apagado); font-weight: 600; border-top: 1px solid var(--linea); }
  .marco { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--fondo); color: var(--tinta); }
  .pagina { padding: 54px var(--margen) 0; }
  .volver { display: inline-flex; align-items: center; gap: 4px; min-height: var(--objetivo-min); font-size: var(--t-cuerpo); font-weight: 500; color: var(--tinta); text-decoration: none; margin-left: -4px; }
  .volver i { font-size: var(--icono); }
  .par { display: flex; justify-content: space-between; margin-top: var(--e-3); font-size: var(--t-meta); line-height: var(--i-meta); color: var(--apagado); font-variant-numeric: var(--cifras); }
  h1 { margin-top: var(--e-1); font-size: var(--t-pieza); line-height: var(--i-pieza); letter-spacing: var(--tr-pieza); font-weight: var(--peso-titulo); text-wrap: balance; }
  .estado { display: grid; grid-template-columns: 24px 1fr; gap: 12px; margin-top: var(--e-4); }
  .estado i { font-size: var(--icono); color: var(--error); justify-self: center; margin-top: 2px; }
  .estado strong { display: block; color: var(--error); font-weight: 600; }
  .estado p { margin-top: var(--e-1); font-size: var(--t-meta); line-height: var(--i-meta); }
  .seccion { margin-top: var(--entre-secciones); border-top: 1px solid var(--tinta); padding-top: 12px; }
  .seccion-cab { display: flex; justify-content: space-between; font-size: var(--t-meta); line-height: var(--i-meta); }
  .seccion-cab b { font-weight: 600; }
  .seccion-cab span { color: var(--apagado); font-variant-numeric: var(--cifras); }
  .ayuda { margin-top: var(--e-2); font-size: var(--t-meta); line-height: var(--i-meta); color: var(--apagado); }
  .voz { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; margin-top: var(--e-3); }
  .play { width: 48px; height: 48px; border-radius: var(--r-circulo); border: var(--trazo-control) solid var(--tinta); background: none; color: var(--tinta); display: grid; place-items: center; font-size: var(--icono); }
  .riel { position: relative; height: 44px; }
  .riel::before { content: ""; position: absolute; left: 0; right: 0; top: 21px; height: 2px; background: var(--campo); border-radius: var(--r-circulo); }
  .riel::after { content: ""; position: absolute; left: 0; top: 15px; width: 14px; height: 14px; border-radius: var(--r-circulo); background: var(--tinta); }
  .tiempo { font-size: var(--t-meta); color: var(--apagado); font-variant-numeric: var(--cifras); }
  .destructiva { display: flex; width: 100%; align-items: center; min-height: var(--objetivo-min); margin-top: var(--entre-secciones); background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--error); }
  .linea { display: block; width: 100%; height: var(--alto-boton); margin-top: var(--e-3); border: var(--trazo-control) solid var(--tinta); border-radius: var(--r-12); background: none; color: var(--tinta); font: inherit; font-weight: 600; text-align: left; padding: 0 16px; }
  .barra { position: absolute; left: 0; right: 0; bottom: 0; background: var(--superficie); box-shadow: var(--sombra-barra); padding: 12px var(--margen) calc(8px + 34px); z-index: var(--capa-barra); }
  .principal { width: 100%; height: var(--alto-boton); border: 0; border-radius: var(--r-12); background: var(--principal); color: var(--sobre-principal); font: inherit; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .principal i { font-size: var(--icono); }
  .saldo { margin-top: var(--e-2); font-size: var(--t-meta); line-height: var(--i-meta); color: var(--apagado); font-variant-numeric: var(--cifras); }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: var(--r-circulo); background: var(--tinta); }
  /* Dark variant for the side-by-side sheet: the same values as :root[data-theme="dark"] in tokens.css, scoped to one frame. */
  .oscuro {
  color-scheme: dark;
  --fondo: #161513;
  --superficie: #1f1d1a;
  --tinta: #ece9e3;
  --apagado: #a39d94;
  --campo: #7c766d;
  --linea: #2f2c28;
  --pista: #2a2724;
  --principal: #d6d2cb;
  --sobre-principal: #161513;
  --sobre-tinta: #161513;
  --firma: #d78099;
  --sobre-firma: #161513;
  --firma-rastro: rgb(215 128 153 / 0.22);
  --error: #e98a7f;
  --exito: #86c39c;
  --aviso: #d9ad66;
  --foto-brillo: 0.94;
  --peso-titulo: 500;
  --sombra-barra: 0 -1px 0 var(--linea), 0 -8px 24px rgb(8 7 6 / 0.45);
  --sombra-flotante: 0 0 0 1px var(--linea), 0 8px 24px rgb(8 7 6 / 0.45);
}
  .oscuro .home { opacity: 1; }
  iframe { display: block; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<div class="lamina">
  <div class="marco">
    <main class="pagina">
      <a class="volver" href="#"><i class="ph ph-caret-left"></i>Inicio</a>
      <div class="par"><span>Pareja</span><span>52 s</span></div>
      <h1>Puedes decir que no</h1>
      <div class="estado" role="alert">
        <i class="ph ph-warning-circle"></i>
        <div>
          <strong>No se pudo terminar el video</strong>
          <p>HeyGen no pudo terminar el video</p>
        </div>
      </div>
      <section class="seccion">
        <div class="seccion-cab"><b>Voz</b><span>0:52</span></div>
        <p class="ayuda">Mientras tanto, puedes escuchar la voz.</p>
        <div class="voz">
          <button class="play" aria-label="Escuchar la voz"><i class="ph-fill ph-play"></i></button>
          <div class="riel" aria-hidden="true"></div>
          <span class="tiempo">0:00 / 0:52</span>
        </div>
      </section>
      <button class="destructiva">Descartar esta pieza</button>
      <button class="linea">Volver a Inicio</button>
    </main>
    <div class="barra">
      <button class="principal">Reintentar<i class="ph ph-arrow-counter-clockwise"></i></button>
      <p class="saldo">Saldo de API de HeyGen: US$ 50,00. Es aparte de tu plan de HeyGen.</p>
      <span class="home"></span>
    </div>
  </div>
  <p class="rotulo-lamina">De noche (modo oscuro de iOS)</p>
  <script>
    const copia = document.querySelector(".marco").cloneNode(true);
    copia.classList.add("oscuro");
    document.querySelector(".lamina").appendChild(copia);
  </script>
</div>
</body>
</html>
